<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>appsecret_proof 計算</title>
<style>
  :root { --bg:#fff; --fg:#1d2433; --muted:#5b6475; --line:#d5dae3; --accent:#1f3864; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --fg:#e8ebf1; --muted:#9aa3b2; --line:#333a46; --accent:#8fb1ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.note { color:var(--muted); font-size:14px; margin:0 0 20px; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  textarea, input { width:100%; box-sizing:border-box; padding:10px; border:1px solid var(--line); border-radius:8px;
    background:transparent; color:inherit; font:14px/1.4 ui-monospace, monospace; }
  button { margin-top:20px; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  #out { margin-top:16px; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>appsecret_proof の計算</h1>
  <p class="note">Meta のシステムユーザートークン発行で使う署名を、このブラウザの中だけで計算します（どこにも送信しません）。
    計算が終わったら、入力欄の中身は消してかまいません。</p>
  <label for="tok">① グラフAPIエクスプローラの Access Token</label>
  <textarea id="tok" rows="4" autocomplete="off" spellcheck="false"></textarea>
  <label for="sec">② アプリの秘密キー（app secret）</label>
  <input id="sec" type="password" autocomplete="off" spellcheck="false">
  <button id="go" type="button">計算する</button>
  <label for="out">③ appsecret_proof（これをエクスプローラに貼る）</label>
  <input id="out" readonly>
</main>
<script>
document.getElementById("go").addEventListener("click", async () => {
  const token = document.getElementById("tok").value.trim();
  const secret = document.getElementById("sec").value.trim();
  const out = document.getElementById("out");
  if (!token || !secret) { out.value = "①と②の両方を入れてください"; return; }
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(token));
  out.value = Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, "0")).join("");
  out.select();
});
</script>
</body>
</html>
