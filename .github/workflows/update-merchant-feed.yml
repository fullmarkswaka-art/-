# Google Merchant Center 用フィードを毎日自動生成して更新する。
# Merchant Center 側は「スケジュールされた取得」でこのファイルの
# raw URL を登録しておけば、カタログが常にサイトと同期される。
name: Update Merchant Center feed

on:
  schedule:
    - cron: "0 21 * * *" # JST 6:00
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests python-dotenv
      - name: Generate feed
        run: python -m ads_manager google feed
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/google_merchant_feed.tsv
          git diff --cached --quiet || { git commit -m "Merchant Centerフィード自動更新"; git push; }
